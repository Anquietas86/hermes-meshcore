name: MeshCore plugin checks

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dashboard test dependencies
        run: python3 -m pip install --disable-pip-version-check fastapi httpx
      - name: Unit and fake-node tests
        run: python3 -m unittest discover -s tests -v
      - name: Compile sources
        run: python3 -m compileall -q .
      - name: Check whitespace and tracked bytecode
        run: |
          git diff --check HEAD^ HEAD 2>/dev/null || git diff --check
          test -z "$(git ls-files '*.pyc' '*__pycache__*')"

  hermes-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: meshcore-platform
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          path: hermes-agent
      - uses: astral-sh/setup-uv@v6
      - name: Install Hermes from its lockfile
        # Hermes pins its runtime dependencies for Python 3.14+ and resolves
        # them with uv (plain pip hits conflicts its lockfile overrides).
        working-directory: hermes-agent
        run: uv sync --frozen --python 3.14
      - name: Smoke test against real Hermes
        env:
          HERMES_SOURCE_ROOT: ${{ github.workspace }}/hermes-agent
        run: hermes-agent/.venv/bin/python meshcore-platform/tests/smoke_hermes.py
