name: meshcore-platform
label: MeshCore
kind: platform
version: 2.0.0
description: >
  MeshCore LoRa mesh platform for Hermes Agent. Talks to a MeshCore
  companion radio over TCP and relays channel messages and DMs to the
  agent. Speaks the companion binary protocol directly (stdlib only).
author: Josh Hagger
provides_tools:
  - meshcore_contact
  - meshcore_admin
requires_env:
  - name: MESHCORE_HOST
    description: "Companion node hostname or IP (TCP)"
    prompt: "MeshCore host"
    password: false
optional_env:
  - name: MESHCORE_PORT
    description: "Companion node TCP port (default 5000)"
    prompt: "MeshCore port"
    password: false
  - name: MESHCORE_ALLOWED_USERS
    description: "Pubkeys or 12+ hex-char prefixes allowed to DM the bot. Set this: with no allowlist Hermes denies everyone and answers unknown DMs with a pairing code over the air"
    prompt: "Allowed pubkey prefixes"
    password: false
  - name: MESHCORE_GROUP_ALLOWED_CHATS
    description: "Channels whose members may all talk to the bot, e.g. channel:1,channel:3"
    prompt: "Open channels"
    password: false
  - name: MESHCORE_ALLOW_ALL_USERS
    description: "Let anyone on the mesh talk to the bot (true/false, default false)"
    prompt: "Allow all users?"
    password: false
  - name: MESHCORE_MONITOR_CHANNELS
    description: "Channel indexes the bot listens and answers in, e.g. 1,2 (empty = DMs only)"
    prompt: "Channels to answer in"
    password: false
  - name: MESHCORE_REQUIRE_MENTION
    description: "Channels that need an @mention: true = every monitored channel, 0,2 = only those, empty = none"
    prompt: "Require @mention"
    password: false
  - name: MESHCORE_ENABLE_DMS
    description: "Answer direct messages (default true)"
    prompt: "Enable DMs?"
    password: false
  - name: MESHCORE_ADMIN_NODES
    description: "Operator pubkeys or 8+ hex-char prefixes; their DMs get the profile's full toolsets and remote repeater queries"
    prompt: "Admin pubkey prefixes"
    password: false
  - name: MESHCORE_ADMIN_CHANNELS
    description: "Channel indexes treated as trusted (admin toolsets). Anyone with the channel key can post there"
    prompt: "Admin channel indexes"
    password: false
  - name: MESHCORE_PUBLIC_TOOLSETS
    description: "Toolsets for non-admin senders (default meshcore)"
    prompt: "Public toolsets"
    password: false
  - name: MESHCORE_ADMIN_TOOLSETS
    description: "Pin an explicit toolset list for admins (default: the profile's own platform_toolsets)"
    prompt: "Admin toolsets"
    password: false
  - name: MESHCORE_HOME_CHANNEL
    description: "Where cron and notifications go: channel:N or dm:<pubkey prefix>"
    prompt: "Home channel"
    password: false
  - name: MESHCORE_BOT_NAME
    description: "Name matched for @mentions (default: the node's advert name)"
    prompt: "Bot name"
    password: false
  - name: MESHCORE_MAX_MESSAGE_BYTES
    description: "Bytes per packet for replies, 40-200 (default 130)"
    prompt: "Max bytes per packet"
    password: false
  - name: MESHCORE_MAX_CHUNKS
    description: "Maximum packets per reply; longer replies are truncated (default 6)"
    prompt: "Max packets per reply"
    password: false
  - name: MESHCORE_ADVERT_ON_START
    description: "Send a flood advert when the gateway starts (default true)"
    prompt: "Advert on start?"
    password: false
  - name: MESHCORE_DEBUG
    description: "Log every frame for troubleshooting (default false)"
    prompt: "Debug logging?"
    password: false
